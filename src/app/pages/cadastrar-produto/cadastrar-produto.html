<div class="main">
    <app-menu-admin></app-menu-admin>

    <main>
        <app-header-admin></app-header-admin>

        <section>
            <div class="editorial-header">
                <h1>ADICIONAR PRODUTO</h1>
                <p>Adicione novos produtos no estoque. Garantir todas as especificações técnicas, metadados categóricos
                    e métricas de avaliação são precisos para relatórios de nível industrial.</p>
            </div>

            <div class="menu">
                <div class="tec-details">
                    <div class="inputs">
                        <h3>Especificações</h3>

                        <p>Nome do Produto</p>
                        <input type="text" placeholder="Digite o nome do produto" [(ngModel)]="produto.nome"
                            maxlength="100">

                        <div class="inputs-section">
                            <div>
                                <p>Categoria</p>

                                <select [(ngModel)]="produto.categoria">
                                    <option value="" disabled selected>Selecione uma categoria</option>
                                    <option value="ferramentas">Ferramentas</option>
                                    <option value="pintura">Pintura</option>
                                    <option value="equipamentos">Equipamentos</option>
                                    <option value="jardinagem">Jardinagem</option>
                                </select>
                            </div>

                            <div>
                                <p>Preço unitário</p>
                                <input type="number" placeholder="Digite o preço" [(ngModel)]="produto.preco" />
                            </div>

                            <div>
                                <p>Url da Imagem</p>
                                <input type="text" placeholder="Ex: ../images/imagemProduto"
                                    [(ngModel)]="produto.urlImg" />
                            </div>

                            <div>
                                <p>Estoque</p>
                                <input type="number" placeholder="Quantidade em estoque"
                                    [(ngModel)]="produto.estoque" />
                            </div>
                        </div>
                    </div>

                    <div class="desc-block">
                        <h3>Descrição técnica</h3>

                        <textarea placeholder="Descreva o produto" [(ngModel)]="produto.descricao" maxlength="800">
                        </textarea>
                    </div>
                </div>

                <div class="sidebar">

                    <button (click)="submeter()">
                        <h3>Salvar Produto <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 16 16" fill="none">
                                <path d="M12.175 9H0V7H12.175L6.575 1.4L8 0L16 8L8 16L6.575 14.6L12.175 9Z"
                                    fill="#5D2F00" />
                            </svg></h3>
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>
