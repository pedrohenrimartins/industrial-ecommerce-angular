<app-header></app-header>

<div class="main">
    <div class="center">
        <div class="leftSide">

            <h1><span> Performance </span><br> Precisa </h1>
            <div class="textos">Contrate profissionais, materiais e ferramentas de melhor qualidade</div>


        </div>




        <div class="rightSide">

            <div class="container">

                <div class="titulo"> Área de Cadastro</div>

                <div class="form">



                    <p class="txtInput">E-mail:
                        <input type="email" name="username" placeholder="nome@gmail.com" [(ngModel)]="pessoa.email">
                    </p>
                    <br>
                    <p class="txtInput">Confirme o E-mail:
                        <input type="text" name="username" placeholder="nome@gmail.com" [(ngModel)]= "confEmail">
                    </p>
                    <br>
                    <p class="txtInput">Senha:
                        <input type="password" name="password" placeholder="••••••••" [(ngModel)]="pessoa.senha">
                    </p>
                    <br>
                    <p class="txtInput">Confirme a Senha:
                        <input type="password" name="password" placeholder="••••••••" [(ngModel)]= "confSenha">
                    </p>
                    <button class="btn-login" [routerLink]="['/login']">
                        <p class="span">Já tem cadastro? acesse: <span>Login</span></p>
                    </button>
                    

                    <button class="btn-cadastrar" (click) = "submeter()">Cadastre-se</button>



                </div>              


            </div>

        </div>
    </div>
</div>

    <app-footer></app-footer>
