<app-header></app-header>

    <div class="main">

        <div class="center">

        <div class="leftSide">

            <h1><span> Performance </span><br> Precisa </h1>
            <p>Contrate profissionais, materiais e ferramentas de melhor qualidade</p>


        </div>



        <div class="rightSide">

            <div class="container">

                <div class="titulo"> Entre na sua Área Pessoal!</div>

                <div class="form">


                    <p class="txtInput">E-mail:
                        <input type="text" name="username" placeholder="nome@gmail.com" [(ngModel)] = "email">
                    </p>
                    <br>
                    <p class="txtInput">Senha:
                        <input type="password" name="password" placeholder="********" [(ngModel)] = "senha">                        
                    </p>
                    

                    <p><span>"Esqueci Minha Senha"</span></p>

                    <button class="input-submeter" [disabled]="botaoDesabilitado" (click)="onBotaoClicado()">
                        Entrar
                    </button>

                    <button class="btn-cadastro" [routerLink]="['/cadastro']">
                        <p class="span">não tem cadastro ainda? acesse: <span>cadastre-se</span></p> 
                    </button>

                    <button class="btn-cadastro" [routerLink]="['/login-admin']">
                        <p class="span">é um administrador? acesse: <span>painel administrativo</span></p> 
                    </button>
                                  
                </div>              


            </div>

        </div>
        </div>
    </div>

    <app-footer></app-footer>
